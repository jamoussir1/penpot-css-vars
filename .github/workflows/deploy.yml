# Publishes the built plugin to GitHub Pages on every push to main.
# One-time setup on GitHub: Settings -> Pages -> Source: "GitHub Actions".
# Install URL afterwards: https://<user>.github.io/<repo>/manifest.json
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build with the public URL of the UI
        run: npm run build
        env:
          VITE_UI_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.html

      - name: Point manifest.json at the full plugin.js URL (needed under a sub-path)
        run: |
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          sed -i "s#\"code\": \"plugin.js\"#\"code\": \"$BASE/plugin.js\"#; s#\"icon\": \"icon.png\"#\"icon\": \"$BASE/icon.png\"#" dist/manifest.json
          cat dist/manifest.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
