# Runs on every push and pull request:
# install -> format check -> lint -> type check -> unit tests -> build.
# If any step fails, the commit gets a red ❌ on GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type check and build
        run: npm run build

      - name: Upload the built plugin
        uses: actions/upload-artifact@v4
        with:
          name: penpot-css-vars-dist
          path: dist
